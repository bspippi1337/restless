plugins {
    id 'com.android.application'
}

android {
    namespace 'org.restless42.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.restless42.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig false
    }
}
