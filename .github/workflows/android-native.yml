name: RESTLESS 42 Native Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and test native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub runners already include a supported Android SDK.
      # Avoid the old setup-android action, which requests the removed "tools" package.
      - name: Locate Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble native debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK structure, manifest and signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|sdkVersion:|targetSdkVersion:|launchable-activity:'
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -qE 'INTERNET|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|ACCESS_NETWORK_STATE'; then
            echo 'Unexpected network or storage permission' >&2
            exit 1
          fi
      - name: Publish sideload test APK (debug signed)
        uses: actions/upload-artifact@v4
        with:
          name: RESTLESS-42-Android-Native-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
