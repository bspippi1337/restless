name: RESTLESS 42 Android Emulator QA

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    name: Native Android 15 instrumented smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test and screenshot on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            cd android
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell am start -n org.restless42.app/.MainActivity
            sleep 3
            adb exec-out screencap -p > ../RESTLESS-42-Android-Emulator.png
      - name: Upload genuine Android screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RESTLESS-42-Android-Emulator-Screenshot
          path: RESTLESS-42-Android-Emulator.png
          retention-days: 30
          if-no-files-found: ignore
