name: Pages | RESTLESS 42 Documentation & Toolbox

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/pages/**'
      - 'docs/RESTLESS_42_*'
      - 'tests/toolbox.test.mjs'
      - 'tests/contract.test.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tools/pages/**'
      - 'docs/RESTLESS_42_*'
      - 'tests/toolbox.test.mjs'
      - 'tests/contract.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-restless-42
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
      - name: Test all browser transforms and OpenAPI tools
        run: |
          node --check site/toolbox/transforms.mjs
          node --check site/toolbox/app.mjs
          node --test tests/toolbox.test.mjs
          node --check site/contract/engine.mjs
          node --check site/contract/app.mjs
          node --test tests/contract.test.mjs
          node --check site/library/engine.mjs
          node --check site/library/app.mjs
          node --test tests/library.test.mjs
      - name: Render full documentation for Pages and offline release
        run: node tools/pages/build-site.mjs
      - name: Validate site and all local links
        run: node tools/pages/site-check.mjs site
      - name: Install browser test runner (pinned)
        run: npm install --prefix "$RUNNER_TEMP/restless-playwright" --no-package-lock --no-save --silent playwright@1.56.1
      - name: Real Chrome browser QA on desktop and mobile
        run: |
          PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/restless-playwright/node_modules/playwright/index.mjs" \
            node tools/pages/browser-smoke.mjs site "$RUNNER_TEMP/restless-screenshots"
      - name: Upload real UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RESTLESS-42-Toolbox-Browser-QA
          path: ${{ runner.temp }}/restless-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
