name: Temporary Botanical Formatter
on:
  push:
    branches:
      - feature/botanical-revalidation-42
    paths:
      - 'internal/botanical/harvest.go'
      - 'internal/botanical/revalidate.go'
      - 'internal/botanical/revalidate_test.go'
      - '.github/workflows/botanical-format-temporary.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: botanical-format-revalidation
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Format new files
        shell: bash
        run: |
          set -Eeuo pipefail
          gofmt -w internal/botanical/harvest.go internal/botanical/revalidate.go internal/botanical/revalidate_test.go
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "restless-format[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/botanical/harvest.go internal/botanical/revalidate.go internal/botanical/revalidate_test.go
          git commit -m "style(botanical): format conditional harvest implementation"
          for attempt in 1 2 3; do
            git fetch origin feature/botanical-revalidation-42
            git rebase origin/feature/botanical-revalidation-42
            if git push origin HEAD:feature/botanical-revalidation-42; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish formatter commit" >&2
          exit 1
